server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API requests belong to the external reverse proxy, not the SPA.
    location = /api {
        return 404;
    }
    location ^~ /api/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:js|css|map|json|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|webp|txt|xml)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
